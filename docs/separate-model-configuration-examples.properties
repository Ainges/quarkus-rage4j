# ==============================================================================
# SEPARATE JUDGE MODEL AND EXECUTING MODEL CONFIGURATION EXAMPLES
# ==============================================================================
#
# This file demonstrates how to configure the Judge Model and Executing Model
# separately in quarkus-rage4j.
#
# JUDGE MODEL (quarkus.rage4j.*):
#   - The LLM used by Rage4j to evaluate the quality of your AI service's responses
#   - Configured using quarkus.rage4j.* properties
#
# EXECUTING MODEL (quarkus.langchain4j.*):
#   - Your application's AI service that generates responses and is being tested
#   - Configured using quarkus.langchain4j.* properties
#
# ==============================================================================

# ------------------------------------------------------------------------------
# Example 1: Both using OpenAI (potentially with different models/keys)
# ------------------------------------------------------------------------------

# Judge Model - OpenAI (default provider)
quarkus.rage4j.api-key=your-openai-api-key-for-judge
#quarkus.rage4j.provider=openai  # Optional, default is openai
#quarkus.rage4j.chat-model=gpt-4  # Optional, use a specific model for judging
#quarkus.rage4j.embedding-model=text-embedding-3-small  # Optional

# Executing Model - OpenAI
#quarkus.langchain4j.openai.api-key=your-openai-api-key-for-service
#quarkus.langchain4j.openai.chat-model.model-name=gpt-3.5-turbo

# ------------------------------------------------------------------------------
# Example 2: Judge with OpenAI, Executing Model with Ollama
# ------------------------------------------------------------------------------

# Judge Model - OpenAI
#quarkus.rage4j.provider=openai
#quarkus.rage4j.api-key=your-openai-api-key
#quarkus.rage4j.chat-model=gpt-4

# Executing Model - Ollama
#quarkus.langchain4j.ollama.base-url=http://localhost:11434
#quarkus.langchain4j.ollama.chat-model.model-id=llama3.2

# ------------------------------------------------------------------------------
# Example 3: Judge with Ollama, Executing Model with OpenAI
# ------------------------------------------------------------------------------

# Judge Model - Ollama
#quarkus.rage4j.provider=ollama
#quarkus.rage4j.ollama-base-url=http://localhost:11434
#quarkus.rage4j.api-key=not-used  # Required by config but not used by Ollama
#quarkus.rage4j.chat-model=llama3.2
#quarkus.rage4j.embedding-model=nomic-embed-text

# Executing Model - OpenAI
#quarkus.langchain4j.openai.api-key=your-openai-api-key

# ------------------------------------------------------------------------------
# Example 4: Both using Ollama (potentially with different models/endpoints)
# ------------------------------------------------------------------------------

# Judge Model - Ollama
#quarkus.rage4j.provider=ollama
#quarkus.rage4j.ollama-base-url=http://localhost:11434
#quarkus.rage4j.api-key=not-used
#quarkus.rage4j.chat-model=llama3.2
#quarkus.rage4j.embedding-model=nomic-embed-text

# Executing Model - Ollama
#quarkus.langchain4j.ollama.base-url=http://localhost:11434
#quarkus.langchain4j.ollama.chat-model.model-id=llama3.1

# ==============================================================================
# KEY BENEFITS OF SEPARATE CONFIGURATION
# ==============================================================================
#
# 1. Use different providers for different purposes
#    Example: Use OpenAI (more powerful) for judging, Ollama (local) for your service
#
# 2. Use different models within the same provider
#    Example: Use GPT-4 for judging, GPT-3.5-turbo for your service
#
# 3. Use different API keys
#    Example: Use a shared team key for judging, personal key for development
#
# 4. Use different endpoints
#    Example: Use different Ollama instances or OpenAI organizations
#
# ==============================================================================
